name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend,deploy,frontend,.gitignore,DEPLOYMENT_CHECKLIST.md,README.md,rundjango.sh"
          target: ${{ secrets.SERVER_PATH }}

      - name: Restart Django process
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/azureuser/stock_analysis
            pm2 restart django || pm2 start /home/azureuser/stock_analysis/rundjango.sh --name django
